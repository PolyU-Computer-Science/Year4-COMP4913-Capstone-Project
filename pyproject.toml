[project]
name = "email_assistant"
version = "0.1.0"
description = "email_assistant using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic,google-genai,litellm,tools]>=1.15.9,<2.0.0",
    "imap-tools>=1.14.0",
    "nicegui>=3.15.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["email_assistant*", "web*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
email_assistant = "email_assistant.main:run"
run_crew = "email_assistant.main:run"
train = "email_assistant.main:train"
replay = "email_assistant.main:replay"
test = "email_assistant.main:test"
run_with_trigger = "email_assistant.main:run_with_trigger"
web = "web.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.crewai]
type = "crew"
