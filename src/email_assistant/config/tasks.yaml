classify_email_task:
  description: >
    Analyze the following email and classify it. Determine the primary intent,
    assess the urgency on a scale of 1-10, write a one-sentence summary, and
    decide whether a reply draft is needed.

    Email content: {email_content}

    Categories to choose from:
    - urgent: requires immediate attention
    - meeting: scheduling, invitations
    - inquiry: questions, requests for information
    - notification: automated system alerts
    - spam: unsolicited or promotional
  expected_output: >
    A structured classification object with:
    - intent: one of urgent, meeting, inquiry, notification, spam
    - urgency_score: integer from 1 to 10
    - summary: one-sentence summary of the email
    - requires_reply: boolean
  agent: classifier

draft_reply_task:
  description: >
    Based on the classified email and its category from the previous task,
    draft a professional reply email. Match the tone of the original sender
    and address the email's intent. If the email does not require a reply,
    output a brief note explaining why.
  expected_output: >
    A draft reply email with subject line and body text, written in
    professional English and formatted as plain text ready to send.
  agent: drafter
